name: Hugo Publish

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

# Let an active production publish finish; keep only the latest pending run.
# Pull-request checks have separate groups and never deploy.
concurrency:
  group: hugo-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Install Hugo Narrow
        # Keep the theme compatible with hugo.yaml and the site's custom layouts.
        run: git clone --depth 1 --branch v2.1.4 https://github.com/tom2almighty/hugo-narrow themes/hugo-narrow

      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --destination public --cleanDestinationDir

      - name: Upload built site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish built site
        id: deployment
        uses: actions/deploy-pages@v5
