on:
  push:
    branches: main
  pull_request:
    branches: main

name: Hugo Publish

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Install Hugo Narrow
        # Keep the theme compatible with hugo.yaml and the site's custom layouts.
        run: git clone --depth 1 --branch v1.3.13 https://github.com/tom2almighty/hugo-narrow themes/hugo-narrow

      - name: Build Hugo site
        run: hugo --minify --destination public --cleanDestinationDir

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
